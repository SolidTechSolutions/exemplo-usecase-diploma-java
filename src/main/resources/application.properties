spring.web.resources.add-mappings=true
server.port=8080
app.name=SolidSign-Example-Usecase-Diploma
app.version=1.0.0

# [EN]    Base URL of the SolidSign API (without path)
# [PT-BR] URL base da API SolidSign (sem o caminho)
# [ES]    URL base de la API SolidSign (sin la ruta)
solidsign.api.base-url=https://solidsign.com.br

# [EN]    Authorization header value — include "Bearer " prefix
# [PT-BR] Valor do header Authorization — inclua o prefixo "Bearer "
# [ES]    Valor del header Authorization — incluya el prefijo "Bearer "
solidsign.api.authorization=Bearer YOUR_JWT_TOKEN_HERE

# [EN]    Shared signature parameters across all 3 steps
# [PT-BR] Parâmetros de assinatura compartilhados pelas 3 etapas
# [ES]    Parámetros de firma compartidos por las 3 etapas
solidsign.diploma.hashAlgorithm=SHA256
solidsign.diploma.signaturePackaging=ENVELOPED
solidsign.diploma.canonicalizationMethod=EXCLUSIVE

# ─────────────────────────────────────────────────────────────────────────
# [EN]    Step 1 — IES Representantes (e-CPF, e.g. reitor/decano) sign the
#         academic data block. Repeat this call once per signer (1..n).
# [PT-BR] Etapa 1 — IES Representantes (e-CPF, ex.: reitor/decano) assinam o
#         bloco de dados acadêmicos. Repita esta chamada uma vez por assinante (1..n).
# [ES]    Etapa 1 — Representantes de la IES (e-CPF, p.ej. rector/decano) firman
#         el bloque de datos académicos. Repita esta llamada una vez por firmante (1..n).
# ─────────────────────────────────────────────────────────────────────────
solidsign.diploma.step1.nodeName=DadosDiploma
solidsign.diploma.step1.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.diploma.step1.profile=ADRT
solidsign.diploma.step1.removeXPathFilter=false

# ─────────────────────────────────────────────────────────────────────────
# [EN]    Step 2 — IES Emissora (e-CNPJ) signs the same data block, but with
#         the XPath exclusion filter removed since this is the last "dados" signature.
# [PT-BR] Etapa 2 — IES Emissora (e-CNPJ) assina o mesmo bloco de dados, mas com
#         o filtro de exclusão XPath removido, pois é a última assinatura de "dados".
# [ES]    Etapa 2 — IES Emisora (e-CNPJ) firma el mismo bloque de datos, pero con
#         el filtro de exclusión XPath eliminado, ya que es la última firma de "datos".
# ─────────────────────────────────────────────────────────────────────────
solidsign.diploma.step2.nodeName=DadosDiploma
solidsign.diploma.step2.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.diploma.step2.profile=ADRT
solidsign.diploma.step2.removeXPathFilter=true

# ─────────────────────────────────────────────────────────────────────────
# [EN]    Step 3 — IES Emissora (e-CNPJ) seals the final envelope (AD-RA),
#         signing the root "DocumentacaoAcademicaRegistro" element.
# [PT-BR] Etapa 3 — IES Emissora (e-CNPJ) sela o envelope final (AD-RA),
#         assinando o elemento raiz "DocumentacaoAcademicaRegistro".
# [ES]    Etapa 3 — IES Emisora (e-CNPJ) sella el sobre final (AD-RA),
#         firmando el elemento raíz "DocumentacaoAcademicaRegistro".
# ─────────────────────────────────────────────────────────────────────────
solidsign.diploma.step3.nodeName=DocumentacaoAcademicaRegistro
solidsign.diploma.step3.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.diploma.step3.profile=ADRA
solidsign.diploma.step3.removeXPathFilter=true
