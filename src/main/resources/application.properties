spring.web.resources.add-mappings=true
server.port=8080
app.name=SolidSign-Example-Usecase-Diploma
app.version=1.0.0

# [EN]    Base URL of the SolidSign API (without path)
# [PT-BR] URL base da API SolidSign (sem o caminho)
solidsign.api.base-url=https://solidsign.com.br

# [EN]    Authorization header value — include "Bearer " prefix
# [PT-BR] Valor do header Authorization — inclua o prefixo "Bearer "
solidsign.api.authorization=Bearer YOUR_JWT_TOKEN_HERE

# [EN]    Signature parameters shared across all 5 documents
# [PT-BR] Parâmetros de assinatura compartilhados pelos 5 documentos
solidsign.diploma.hashAlgorithm=SHA256
solidsign.diploma.signaturePackaging=ENVELOPED
solidsign.diploma.canonicalizationMethod=EXCLUSIVE

# ═══════════════════════════════════════════════════════════════════════════
# [EN]    DOCUMENT 1/5 — Documentação Acadêmica de Registro (3 steps)
# [PT-BR] DOCUMENTO 1/5 — Documentação Acadêmica de Registro (3 etapas)
# ═══════════════════════════════════════════════════════════════════════════
# [EN]    Step 1 — IES Representantes (e-CPF, e.g. reitor/decano). Repeat once per signer (1..n).
# [PT-BR] Etapa 1 — IES Representantes (e-CPF, ex.: reitor/decano). Repita uma vez por assinante (1..n).
solidsign.documentacaoAcademica.step1.nodeName=DadosDiploma
solidsign.documentacaoAcademica.step1.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.documentacaoAcademica.step1.profile=ADRT
solidsign.documentacaoAcademica.step1.removeXPathFilter=false

# [EN]    Step 2 — IES Emissora (e-CNPJ), last "dados" signature, XPath filter removed.
# [PT-BR] Etapa 2 — IES Emissora (e-CNPJ), última assinatura de "dados", filtro XPath removido.
solidsign.documentacaoAcademica.step2.nodeName=DadosDiploma
solidsign.documentacaoAcademica.step2.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.documentacaoAcademica.step2.profile=ADRT
solidsign.documentacaoAcademica.step2.removeXPathFilter=true

# [EN]    Step 3 — IES Emissora (e-CNPJ) seals the final envelope (AD-RA).
# [PT-BR] Etapa 3 — IES Emissora (e-CNPJ) sela o envelope final (AD-RA).
solidsign.documentacaoAcademica.step3.nodeName=DocumentacaoAcademicaRegistro
solidsign.documentacaoAcademica.step3.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.documentacaoAcademica.step3.profile=ADRA
solidsign.documentacaoAcademica.step3.removeXPathFilter=true

# ═══════════════════════════════════════════════════════════════════════════
# [EN]    DOCUMENT 2/5 — Diploma Digital. ASSEMBLED first (POST .../diploma/assemble copies
#         <DadosDiploma> from the signed Documentação Acadêmica into the Diploma envelope
#         template, see templates/diploma-template.xml), then signed in 2 steps.
# [PT-BR] DOCUMENTO 2/5 — Diploma Digital. MONTADO primeiro (POST .../diploma/assemble copia
#         <DadosDiploma> da Documentação Acadêmica assinada pro template do envelope Diploma,
#         ver templates/diploma-template.xml), depois assinado em 2 etapas.
# ═══════════════════════════════════════════════════════════════════════════
# [EN]    Step 1 — Representante da Registradora (e-CPF) signs DadosRegistro.
# [PT-BR] Etapa 1 — Representante da Registradora (e-CPF) assina DadosRegistro.
solidsign.diplomaDoc.step1.nodeName=DadosRegistro
solidsign.diplomaDoc.step1.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.diplomaDoc.step1.profile=ADRT
solidsign.diplomaDoc.step1.removeXPathFilter=false

# [EN]    Step 2 — IES Registradora (e-CNPJ) seals the final envelope (AD-RA).
# [PT-BR] Etapa 2 — IES Registradora (e-CNPJ) sela o envelope final (AD-RA).
solidsign.diplomaDoc.step2.nodeName=Diploma
solidsign.diplomaDoc.step2.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.diplomaDoc.step2.profile=ADRA
solidsign.diplomaDoc.step2.removeXPathFilter=true

# ═══════════════════════════════════════════════════════════════════════════
# [EN]    DOCUMENT 3/5 — Histórico Escolar Digital. PARTIAL modality: call step2 only.
#         FULL modality: call step1 then step2.
# [PT-BR] DOCUMENTO 3/5 — Histórico Escolar Digital. Modalidade PARCIAL: chame só a step2.
#         Modalidade INTEGRAL: chame a step1 e depois a step2.
# ═══════════════════════════════════════════════════════════════════════════
# [EN]    Step 1 — Representante da Secretaria (e-CPF), FULL modality only.
# [PT-BR] Etapa 1 — Representante da Secretaria (e-CPF), só na modalidade INTEGRAL.
solidsign.historicoEscolar.step1.nodeName=DadosHistoricoEscolar
solidsign.historicoEscolar.step1.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.historicoEscolar.step1.profile=ADRT
solidsign.historicoEscolar.step1.removeXPathFilter=false

# [EN]    Step 2 — IES Emissora (e-CNPJ) seals the final envelope (AD-RA). Always required.
# [PT-BR] Etapa 2 — IES Emissora (e-CNPJ) sela o envelope final (AD-RA). Sempre obrigatória.
solidsign.historicoEscolar.step2.nodeName=HistoricoEscolar
solidsign.historicoEscolar.step2.namespace=http://portal.mec.gov.br/diplomadigital/arquivos-em-xsd
solidsign.historicoEscolar.step2.profile=ADRA
solidsign.historicoEscolar.step2.removeXPathFilter=true

# ═══════════════════════════════════════════════════════════════════════════
# [EN]    DOCUMENT 4/5 — Currículo Escolar Digital. Signed over the ENTIRE document (no
#         signatureNodeName), 2 steps: Coordenador do Curso then IES Emissora.
# [PT-BR] DOCUMENTO 4/5 — Currículo Escolar Digital. Assinado sobre o DOCUMENTO INTEIRO (sem
#         signatureNodeName), 2 etapas: Coordenador do Curso e depois IES Emissora.
# ═══════════════════════════════════════════════════════════════════════════
solidsign.curriculoEscolar.step1.profile=ADRT
solidsign.curriculoEscolar.step1.removeXPathFilter=false
solidsign.curriculoEscolar.step2.profile=ADRA
solidsign.curriculoEscolar.step2.removeXPathFilter=true

# ═══════════════════════════════════════════════════════════════════════════
# [EN]    DOCUMENT 5/5 — Lista de Diplomas Anulados / Arquivo de Fiscalização. Single step,
#         signed over the ENTIRE document (no signatureNodeName), e-CNPJ.
# [PT-BR] DOCUMENTO 5/5 — Lista de Diplomas Anulados / Arquivo de Fiscalização. Etapa única,
#         assinada sobre o DOCUMENTO INTEIRO (sem signatureNodeName), e-CNPJ.
# ═══════════════════════════════════════════════════════════════════════════
solidsign.listaAnulados.profile=ADRT
solidsign.listaAnulados.removeXPathFilter=false
